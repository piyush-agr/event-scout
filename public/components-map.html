  <rect x="1030" y="940" width="225" height="100" rx="10" fill="#dcecfc" stroke="#1d6fd6" stroke-width="2"/>
  <foreignObject x="1030" y="940" width="225" height="100"><div xmlns="http://www.w3.org/1999/xhtml" class="box">Sends the digest email to each subscriber</div></foreignObject>

  <rect x="1560" y="170" width="225" height="135" rx="10" fill="#fde2df" stroke="#e03a2f" stroke-width="2"/>
  <foreignObject x="1560" y="170" width="225" height="135"><div xmlns="http://www.w3.org/1999/xhtml" class="box" style="font-size:14.5px">Monday email: ranked events with context, red flag if registration closes in under 7 days. Same digest + run log on the web dashboard</div></foreignObject>

<p class="note">AI is used only for the two steps in the AI lane. Filtering, deduplication, ranking order, deadline flags and the “real source URL” check are ordinary code. Full detail: COMPONENTS_MAP.md in the GitHub repo.</p>
